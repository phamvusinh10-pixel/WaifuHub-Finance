<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaifuHub Portal</title>
  
  <!-- FontAwesome 6 Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-start: #060914;
      --bg-end: #111827;
      --card-bg: rgba(11, 20, 41, 0.72);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-soft: rgba(148, 163, 184, 0.18);
      --shadow-soft: rgba(15, 23, 42, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.15), transparent 24%),
                  radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.12), transparent 24%),
                  linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 40px 18px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.12), transparent 28%);
      pointer-events: none;
      opacity: 0.85;
      z-index: 0;
    }

    .content {
      position: relative;
      width: min(100%, 1040px);
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: clamp(2.4rem, 3vw, 3.4rem);
      font-weight: 800;
      letter-spacing: 1.6px;
      line-height: 1.05;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #38bdf8, #c084fc, #fb7185);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 24px rgba(192, 132, 252, 0.28);
    }

    header p {
      max-width: 760px;
      margin: 0 auto;
      color: var(--text-sub);
      font-size: 1rem;
      line-height: 1.8;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
    }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      width: 100%;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-soft);
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.28);
      border-radius: 24px;
      padding: 30px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease, background 0.35s ease;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 42%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .card:hover::before {
      opacity: 1;
    }

    .icon-wrapper {
      position: relative;
      z-index: 1;
      width: 68px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
      transition: transform 0.35s ease, background 0.35s ease;
    }

    .icon-wrapper i {
      font-size: 2.1rem;
      color: var(--glow-color);
      filter: drop-shadow(0 0 12px var(--glow-color));
    }

    .card span {
      position: relative;
      z-index: 1;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      white-space: nowrap;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.32);
      background: rgba(19, 30, 54, 0.9);
      box-shadow: 0 28px 70px rgba(15, 23, 42, 0.35);
    }

    .card:hover .icon-wrapper {
      transform: scale(1.12);
      background: rgba(255, 255, 255, 0.14);
    }

    .footer {
      margin-top: 36px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.94rem;
      line-height: 1.7;
      opacity: 0.92;
    }

    .footer strong {
      color: #e2e8f0;
    }

    .c-fb      { --glow-color: #1877f2; }
    .c-tiktok  { --glow-color: #25f4ee; }
    .c-yt      { --glow-color: #ff0000; }
    .c-photo   { --glow-color: #ec4899; }
    .c-wallet  { --glow-color: #4ade80; }
    .c-game    { --glow-color: #f43f5e; }
    .c-health  { --glow-color: #c084fc; }
    .c-python  { --glow-color: #38bdf8; }
    .c-book    { --glow-color: #fbbf24; }
    .c-test    { --glow-color: #a855f7; }

    @media (max-width: 520px) {
      body {
        padding: 28px 14px;
      }

      .card {
        padding: 24px 14px;
      }

      header h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>

  <main class="content">
    <header>
      <h1>WAIFUHUB PORTAL</h1>
      <p>Khởi động nhanh các liên kết yêu thích và dịch vụ cốt lõi với giao diện tối, hiện đại và bắt mắt.</p>
    </header>

    <div class="portal-grid">
      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Mở Facebook (mở cửa sổ mới)" class="card c-fb">
        <div class="icon-wrapper"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></div>

        <div class="icon-wrapper"><i class="fa-brands fa-tiktok" aria-hidden="true"></i></div>
        <span>TikTok</span>
      </a>
      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" aria-label="Mở YouTube (mở cửa sổ mới)" class="card c-yt">
        <div class="icon-wrapper"><i class="fa-brands fa-youtube" aria-hidden="true"></i></div>
        <span>YouTube</span>
      </a>
      <a href="photocosplay.html" aria-label="Photo Cosplay" class="card c-photo">
        <div class="icon-wrapper"><i class="fa-solid fa-camera-retro" aria-hidden="true"></i></div>
        <span>Photo Cosplay</span>
      </a>
      <a href="chitieu.html" aria-label="Chi Tiêu" class="card c-wallet">
        <div class="icon-wrapper"><i class="fa-solid fa-wallet" aria-hidden="true"></i></div>
        <span>Chi Tiêu</span>
      </a>
      <a href="game.html" aria-label="Game" class="card c-game">
        <div class="icon-wrapper"><i class="fa-solid fa-gamepad" aria-hidden="true"></i></div>
        <span>Game</span>
      </a>
      <a href="suckhor.html" aria-label="Sức Khỏe" class="card c-health">
        <div class="icon-wrapper"><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i></div>
        <span>Sức Khỏe</span>
      </a>
      <a href="python.html" aria-label="Python" class="card c-python">
        <div class="icon-wrapper"><i class="fa-brands fa-python" aria-hidden="true"></i></div>
        <span>Python</span>
      </a>
      <a href="huongdanweb.html" aria-label="Hướng Dẫn Web" class="card c-book">
        <div class="icon-wrapper"><i class="fa-solid fa-book-open" aria-hidden="true"></i></div>
        <span>Hướng Dẫn Web</span>
      </a>
      <a href="test.html" aria-label="Test 1" class="card c-test">
        <div class="icon-wrapper"><i class="fa-solid fa-vial" aria-hidden="true"></i></div>
        <span>Test 1</span>
      </a>
      <a href="test2.html" aria-label="Test 2" class="card c-test">
        <div class="icon-wrapper"><i class="fa-solid fa-flask" aria-hidden="true"></i></div>
        <span>Test 2</span>
      </a>
      <a href="test3.html" aria-label="Test 3" class="card c-test">
        <div class="icon-wrapper"><i class="fa-solid fa-microscope" aria-hidden="true"></i></div>
        <span>Test 3</span>
      </a>
    </div>

      <footer style="position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 10px; color: rgba(255,255,255,0.4); font-size: 11px; z-index: 1; pointer-events: none;">
        @ 2026_Phạm Vũ Sinh
      </footer>
</body>
</body>
</html>
