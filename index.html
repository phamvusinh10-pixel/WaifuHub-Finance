<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaifuHub Portal</title>
  
  <!-- FontAwesome 6 Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --card-bg: rgba(15, 23, 42, 0.75);
      --text-main: #f1f5f9;
      --text-sub: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #090d16;
      /* Lớp phủ tối mờ để làm nổi bật nút bấm */
      background-image: linear-gradient(135deg, rgba(9, 13, 22, 0.85), rgba(26, 16, 48, 0.8));
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      transition: background-image 0.5s ease-in-out;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
      position: relative;
      z-index: 2;
    }

header h1 {
  font-size: 2.5rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  background: linear-gradient(135deg, #38bdf8, #c084fc, #f472b6);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
  text-shadow: 0 0 25px rgba(192, 132, 252, 0.4);
}
    header p {
      color: var(--text-sub);
      font-size: 1.05rem;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* GRID SYSTEM */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 860px;
      position: relative;
      z-index: 2;
    }

    /* CARD STYLING */
    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glow-color);
      box-shadow: 0 8px 20px -3px rgba(0, 0, 0, 0.5), 0 0 15px -3px var(--glow-shadow);
      border-radius: 20px;
      padding: 28px 12px 22px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .icon-wrapper {
      position: relative;
      z-index: 1;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
      transition: transform 0.35s ease;
    }

    .icon-wrapper i {
      font-size: 2.1rem;
      color: var(--glow-color);
      filter: drop-shadow(0 0 10px var(--glow-color));
    }

    .card span {
      position: relative;
      z-index: 1;
      font-size: 0.98rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .card:hover {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px 2px var(--glow-shadow);
      border-color: #ffffff;
      background: rgba(30, 41, 59, 0.9);
    }

    .card:hover .icon-wrapper {
      transform: scale(1.12);
    }

    /* MÀU NEON */
    .c-fb      { --glow-color: #1877f2; --glow-shadow: rgba(24, 119, 242, 0.6); }
    .c-tiktok  { --glow-color: #25f4ee; --glow-shadow: rgba(37, 244, 238, 0.6); }
    .c-yt      { --glow-color: #ff0000; --glow-shadow: rgba(255, 0, 0, 0.65); }
    .c-photo   { --glow-color: #ec4899; --glow-shadow: rgba(236, 72, 153, 0.6); }
    .c-wallet  { --glow-color: #4ade80; --glow-shadow: rgba(74, 222, 128, 0.6); }
    .c-game    { --glow-color: #f43f5e; --glow-shadow: rgba(244, 63, 94, 0.6); }
    .c-health  { --glow-color: #c084fc; --glow-shadow: rgba(192, 132, 252, 0.6); }
    .c-python  { --glow-color: #38bdf8; --glow-shadow: rgba(56, 189, 248, 0.6); }
    .c-book    { --glow-color: #fbbf24; --glow-shadow: rgba(251, 191, 36, 0.6); }
    .c-test    { --glow-color: #a855f7; --glow-shadow: rgba(168, 85, 247, 0.5); }
  </style>
</head>

  <header>

   <script>
  async function loadRandomCosplayBackground() {
    try {
      // Fetch trực tiếp file photocosplay.html cùng thư mục
      const response = await fetch('photocosplay.html');
      const htmlText = await response.text();

      // Đọc các thẻ <img> trong file photocosplay.html
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      const imgElements = doc.querySelectorAll('img');

      // Lấy danh sách link ảnh
      const imageSources = Array.from(imgElements)
        .map(img => img.getAttribute('src'))
        .filter(src => src && !src.startsWith('data:'));

      if (imageSources.length > 0) {
        // Lấy ngẫu nhiên 1 ảnh
        const randomImg = imageSources[Math.floor(Math.random() * imageSources.length)];

        // Đặt làm nền
        document.body.style.backgroundImage = `
          linear-gradient(135deg, rgba(9, 13, 22, 0.82), rgba(26, 16, 48, 0.78)),
          url('${randomImg}')
        `;
      }
    } catch (error) {
      console.error("Lỗi tải ảnh nền:", error);
    }
  }

  loadRandomCosplayBackground();
</script>
</script>
